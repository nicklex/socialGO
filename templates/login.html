{{define "loginPage"}}
{{template "header"}}
<main class="container">
    <div class="auth-card">
        <h2>С возвращением в socialGO</h2>
        <form action="/auth">
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Пароль" required>
            <button type="submit" class="auth-btn">Войти</button>
        </form>
        <p style="font-size: 14px; color: var(--gray);">Нет аккаунта? <a href="/register" style="color: var(--accent);">Регистрация</a></p>
    </div>
</main>
{{template "footer"}}
{{end}}
